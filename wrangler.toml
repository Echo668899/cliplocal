name = "cliplocal"
main = "worker/index.js"
compatibility_date = "2025-04-01"
workers_dev = true

[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
# Only invoke Worker for FFmpeg cores; SPA/static files use assets + _headers.
run_worker_first = ["/ffmpeg/*"]

[[r2_buckets]]
binding = "FFMPEG_BUCKET"
bucket_name = "cliplocal-ffmpeg"
