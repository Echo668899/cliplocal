name: Deploy Cloudflare Pages

# Pages workflow kept disabled; ClipLocal now deploys via Workers.
# Re-enable by removing the schedule filter / using workflow_dispatch only if needed.
on:
  workflow_dispatch:

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  skipped:
    runs-on: ubuntu-latest
    steps:
      - name: Notice
        run: echo "Pages deploy is retired. Use the Deploy Cloudflare Worker workflow instead."
